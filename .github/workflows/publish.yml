name: Publish
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v1.0.0-beta.1)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag override (leave empty to derive from the tag)
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: '22.13.0'
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Resolve npm dist-tag
      id: npm-dist-tag
      shell: bash
      env:
        RELEASE_BODY: ${{ github.event.release.body }}
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        DISPATCH_DIST_TAG: ${{ inputs.dist_tag }}
      run: |
        set -euo pipefail

        explicit_tag="$DISPATCH_DIST_TAG"

        if [ -z "$explicit_tag" ]; then
          explicit_tag="$(
            printf '%s\n' "$RELEASE_BODY" \
              | sed -nE 's/^[[:space:]]*npm-dist-tag:[[:space:]]*([A-Za-z0-9._-]+)[[:space:]]*$/\1/p' \
              | head -n 1
          )"
        fi

        if [ -n "$explicit_tag" ]; then
          dist_tag="$explicit_tag"
        elif [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z0-9]+)([.-][A-Za-z0-9]+)*$ ]]; then
          dist_tag="${BASH_REMATCH[1]}"
        elif [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          dist_tag="latest"
        else
          echo "::error::Release tag '$RELEASE_TAG' is not a supported semver tag."
          exit 1
        fi

        if [[ ! "$dist_tag" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]]; then
          echo "::error::Invalid npm dist-tag '$dist_tag'."
          exit 1
        fi

        echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
        echo "Resolved npm dist-tag: $dist_tag"

    - name: Publish to npm
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        NPM_DIST_TAG: ${{ steps.npm-dist-tag.outputs.dist-tag }}
      run: pnpm --recursive publish --tag "$NPM_DIST_TAG" --no-git-checks
